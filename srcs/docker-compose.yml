volumes :
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      device: ${DATA_DIR}/wordpress
      o: bind
      type: none
  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      device: ${DATA_DIR}/mariadb
      o: bind
      type: none
  adminer:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR}/adminer

services:
  wordpress:
    container_name: wordpress
    build:
      context: ./wordpress/
      dockerfile: Dockerfile
    tags:
      - "wordpress"
    networks:
      - docker-network
    volumes:
      - wordpress:/var/www/html
    depends_on:
      - mariadb
    expose:
      - "9000"
    env_file:
      - .env
    restart: unless-stopped
  mariadb:
    image: mariadb
    container_name: mariadb
    build:
      context: ./mariadb/
      dockerfile: Dockerfile
    tags:
      - "mariadb"
    networks:
      - docker-network
    volumes:
      - mariadb:/var/lib/mysql
    expose:
      - "3306"
    environment:
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    restart: unless-stopped
  nginx:
    image: nginx
    container_name: nginx
    build:
      context: ./nginx/
      dockerfile: Dockerfile
    tags:
      - "nginx"
    networks:
      - docker-network
    volumes:
      - wordpress:/var/www/html
      - ./nginx/ssl:/etc/nginx/ssl
    ports:
      - "443:443"
    depends_on:
      - wordpress
      - mariadb
    restart: unless-stopped
  adminer:
    build:
      context: ./adminer/
      dockerfile: Dockerfile
    tags:
      - "adminer"
    container_name: adminer
    restart: always
    networks:
      - docker-network
    depends_on:
      - mariadb
    volumes:
      - adminer:/var/www/html
networks:
  docker-network:
    name: docker-network
    driver: bridge
